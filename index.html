 if(t.park&&op=='tb'){if(!XO.includes(t.cur))return toast('この駅では折返せません');return ex('折返して運転再開',()=>{t.park=0;t.cut=0;t.turn=1;t.depT=S.t})}
 if(op=='tb'||op=='tb2'){const i=op=='tb'?t.nxt:v('ts');if(!ok(i)||!XO.includes(i))return toast('その駅では折返せません(渡り線なし/通過済み)');ex(`${N[i]}で折返し`,()=>{t.end=i;t.turn=1;t.stop[i]=true})}
 if(op=='dest'){const i=v('td');if(!ok(i))return toast('通過済みの駅です');ex(`行先を${N[i]}に変更`,()=>{t.end=i;t.turn=0;t.stop[i]=true})}
 if(op=='cx'){if(t.st=='sched')ex('運休',()=>{t.st='cx';S.st.cx++});else ex(`${N[t.nxt]}で運転打切り`,()=>{t.end=t.nxt;t.turn=0;t.cut=1;t.stop[t.nxt]=true;S.st.cx++})}
 if(op=='ds')ex('回送(全駅通過)',()=>{t.stop=t.stop.map(()=>false);t.type='回送'});
 if(op=='stp'){if(t.stop[t.nxt])return toast('次駅は停車駅です');ex(`${N[t.nxt]}に停車`,()=>t.stop[t.nxt]=true)}
 if(op=='typ'){const k=TYO.indexOf(t.type);if(k<0||k>=5)return toast('これ以上種別を下げられません');const nt=TYO[k+1];ex(`種別を${nt}に変更`,()=>{t.type=nt;for(let q=t.nxt;(t.end-q)*s>=0;q+=s)t.stop[q]=!TY[nt].sk.includes(q)||q==t.end})}
 if(op=='wf'){let w=Q('wt').value;if(w=='next'){const B=S.trains.filter(x=>x!=t&&x.dir==t.dir&&(x.st=='sched'||(live(x)&&(x.pos-t.pos)*s<0))).sort((a,b)=>(a.st=='sched'?1e9+a.t0:Math.abs(a.pos-t.pos))-(b.st=='sched'?1e9+b.t0:Math.abs(b.pos-t.pos)))[0];if(!B)return toast('次の電車が見つかりません');w=B.id}if(!w||w==t.id)return;ex(`${w}を待ち合わせ`,()=>t.wf=w)}
 setTimeout(updSi,50)}
function SEC(){let a=+$('#sa').value,b=+$('#sb').value;const k=$('#sk').value;if(a>b)[a,b]=[b,a];const ov=x=>x.a<=b&&x.b>=a;
 if(k=='clr'){const hz=S.secs.filter(x=>x.src!='user'&&x.type=='susp'&&ov(x)),run=()=>{S.secs=S.secs.filter(x=>!ov(x)||(x.src!='user'&&!hz.includes(x)&&x.type!='susp'&&false));S.secs=S.secs.filter(x=>!(ov(x)&&(x.src=='user'||hz.includes(x))));rc();note(`${N[a]}〜${N[b]} 指示解除・運転再開`,'cmd')};
  hz.length?ask('異常が継続中の区間です。強制再開は安全上の重大な問題になります。実行しますか?',()=>{S.st.inc++;run()}):ask(`${N[a]}〜${N[b]}の指示を解除します`,run)}
 else ask(`${N[a]}〜${N[b]} ${k=='susp'?'運転見合わせ':'徐行'+k+'km/h'}を指示します`,()=>{S.secs.push({a,b,src:'user',type:k=='susp'?'susp':'slow',v:k/3.6});rc();note(`${N[a]}〜${N[b]} ${k=='susp'?'運転見合わせ':'徐行'+k+'km/h'}`,'cmd')})}
function TOK(){const i=+$('#xs').value,d=+$('#xd').value;if((d==0&&i==23)||(d==1&&i==0))return toast('その方向の始発にできません');if(!FS(d,i))return toast('駅構内に在線中/閉鎖中のため設定できません');ask(`${N[i]}発 ${d?'上り':'下り'}の臨時列車を設定します`,()=>{const t=mk(i,d,S.t+150,{sfx:'S',type:'臨時快速'});note(`特発 ${t.id} ${N[i]}発 ${N[t.end]}行`,'cmd')})}
function ANN(){const m=$('#am').value,t=$('#at').value=='sel'?sel:null;ask(`案内放送を実行: ${m}`,()=>{S.st.ann++;S.lastAnn=S.t;note(`【案内放送】${t?t+'車内':'全線'}:${m}`,'ann');sChime()})}
function renderTabs(){$('#tb').innerHTML=[['dg','ダイヤグラム'],['tl','列車一覧'],['sl','ダイヤ一覧'],['nt','お知らせ'],['cm','指令'],['ev','評価']].map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';renderTabs();renderPn(1)">${n}</button>`).join('')}
function renderPn(force){if(!S)return;if(tab=='dg'){if(!$('#dc')||force)$('#pn').innerHTML='<canvas id=dc width=1100 height=340 style="width:100%"></canvas>';drawDg()}
 else if(tab=='cm'){if(force||!$('#si'))cmHTML();else updSi()}else{const p=$('#pn'),y=p.scrollTop;p.innerHTML=listHTML();p.scrollTop=y}}
$('#pn').onclick=e=>{const r=e.target.closest('[data-t]');if(r){pick(r.dataset.t)}else if(e.target.id=='dc'){const c=e.target,k=c.width/c.getBoundingClientRect().width,mx=e.offsetX*k,my=e.offsetY*k,T=S.t,X=t=>60+(t-(T-1800))/5400*1030,Yy=p=>18+p/K[23]*300;let b=null,bd=16;
  for(const t of S.trains){const pts=Object.keys(t.pl).flatMap(i=>[[t.pl[i][0],K[i]],[t.pl[i][1],K[i]]]).concat(t.trail);for(const p of pts){const q=Math.hypot(X(p[0])-mx,Yy(p[1])-my);if(q<bd){bd=q;b=t.id}}}
  if(b){pick(b)}}};
function PP(){S.run^=1;$('#pp').textContent=S.run?'⏸':'▶'}
function SM(v){v=parseFloat(v);if(v>0){S.mult=v;toast(`時間進行 ${v}倍`)}}
function GO(){const[h,m]=$('#stt').value.split(':').map(Number),lv=+$('#df').value,ev=$('#evc').checked;try{localStorage.setItem('occ',JSON.stringify({t:$('#stt').value,lv,ev,dy:$('#dy').value}))}catch(e){}init(h*3600+m*60,lv,ev);S.run=1;$('#pp').textContent='⏸'}
try{const p=JSON.parse(localStorage.getItem('occ'));if(p){$('#stt').value=p.t;$('#df').value=p.lv;$('#evc').checked=p.ev;if(p.dy)$('#dy').value=p.dy}}catch(e){}
GO();let fc=0;
setInterval(()=>{const n=performance.now(),dt=Math.min(1,(n-last)/1000);last=n;if(S.run){acc+=dt*S.mult;let c=0;while(acc>=1&&c<3000){step();acc--;c++}if(acc>5)acc=0}
 $('#clk').textContent=f(S.t);draw();if(++fc%5==0){if(tab!='cm'||fc%10==0)renderPn(0);updSi()}},100);
</script></body></html>
